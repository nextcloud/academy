name: Pull request

# Nothing verified pull requests before this: the only workflow was the Pages
# deploy, which runs on push to main. So a change that broke the build was
# discovered by the deploy failing, or worse, by the live site changing.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous run for the same ref.
concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same version the Pages deploy uses, so a PR cannot pass here and
          # then fail on deploy.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory, not blocking. main currently has three
      # react-hooks/set-state-in-effect errors, all the same pattern: reading
      # saved progress from localStorage on mount. That effect is deliberate -
      # localStorage does not exist during prerender, and a lazy useState
      # initialiser would make the prerendered HTML differ from the client
      # render and mismatch on hydration. Properly satisfying the rule means
      # moving to useSyncExternalStore in three components, which is its own
      # change.
      #
      # Blocking on a rule main already fails would make every PR red and teach
      # everyone to ignore CI. Flip this to blocking once those three are
      # resolved either way.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # `next build` typechecks as part of the build, but running tsc first
      # gives a clearer failure than a build that dies mid-compile.
      - name: Typecheck
        run: npx tsc --noEmit

      # The real check. This is a static export, so the build is what actually
      # renders every route: a missing generateStaticParams, a module whose
      # markdown was deleted, or a manifest entry pointing at nothing all fail
      # here rather than in production.
      - name: Build static export
        run: npm run build
